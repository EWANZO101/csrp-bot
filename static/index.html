<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#060a12"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<link rel="apple-touch-icon" href="/brand/logo">
<title>Panel</title>
<link rel="icon" href="/brand/logo">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/app.css?v=8">
</head>
<body>
<div class="backdrop"></div><div class="watermark"></div>
<div id="app"></div>
<div class="modal-bg" id="mbg"><div class="modal" id="mbox"><button class="x" onclick="closeModal()" aria-label="Close">×</button><div id="mbody"></div></div></div>
<div class="toast" id="toast"></div>
<script>
/* ───────────────────────── helpers ───────────────────────── */
const $ = s => document.querySelector(s), $$ = s => [...document.querySelectorAll(s)];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
let ME=null, CUR="$", PAGE="", BRAND={name:"Panel",full:"",color:"#38b6ff"}, GS=null;
const fmt = n => (n<0?"-":"")+CUR+Math.abs(Number(n||0)).toLocaleString();
const ago = iso => { if(!iso) return "—"; const s=(Date.now()-new Date(iso))/1000, f=Math.abs(s);
  const t=f<60?`${Math.round(f)}s`:f<3600?`${Math.round(f/60)}m`:f<86400?`${Math.round(f/3600)}h`:`${Math.round(f/86400)}d`; return s>=0?`${t} ago`:`in ${t}`; };
const dtx = iso => iso ? new Date(iso).toLocaleString() : "—";
const user = u => u ? `<span class="u">${u.avatar?`<img src="${esc(u.avatar)}" alt="">`:""}${esc(u.name)}</span>` : `<span class="dim">—</span>`;
const empty = (ico, t) => `<div class="empty"><span class="e-ico">${ico}</span>${t}</div>`;
async function api(path, body){
  const opt = body!==undefined ? {method:"POST",headers:{"Content-Type":"application/json","X-Panel":"1"},body:JSON.stringify(body)} : {};
  const r = await fetch(path, opt); let j={}; try{ j=await r.json(); }catch(e){}
  if(r.status===401){ renderLogin(); throw new Error("login"); }
  if(!r.ok) throw new Error(j.error || `HTTP ${r.status}`);
  return j;
}
function toast(m, ok=true){ const t=$("#toast"); t.textContent=m; t.className="toast "+(ok?"ok":"err"); t.style.display="block"; clearTimeout(t._h); t._h=setTimeout(()=>t.style.display="none",4000); }
async function act(fn, okMsg){ try{ const r=await fn(); if(okMsg) toast(okMsg); return r||true; }catch(e){ if(e.message!=="login") toast(e.message,false); return false; } }
function openModal(h, wide){ $("#mbody").innerHTML=h; $("#mbox").className="modal"+(wide?" wide":""); $("#mbg").style.display="flex"; }
function closeModal(){ $("#mbg").style.display="none"; }
$("#mbg").addEventListener("mousedown", e=>{ if(e.target.id==="mbg") closeModal(); });
function applyBrand(b){ if(!b) return; BRAND={...BRAND,...Object.fromEntries(Object.entries(b).filter(([k,v])=>v))};
  const m=/^#?([0-9a-f]{6})$/i.exec(BRAND.color||""); if(m){ const h=m[1]; document.documentElement.style.setProperty("--brand","#"+h);
  document.documentElement.style.setProperty("--brand-rgb",[0,2,4].map(i=>parseInt(h.substr(i,2),16)).join(",")); }
  document.title = `${BRAND.name} Panel`; }
const copyBtn = t => `<button class="btn ghost sm" onclick="navigator.clipboard.writeText('${esc(t)}');toast('Copied')">Copy</button>`;
const opt = (list, sel, blank="—") => `<option value="">${blank}</option>`+list.map(x=>`<option value="${x.id}" ${String(sel)===String(x.id)?"selected":""}>${esc(x.label||x.name)}</option>`).join("");

/* icons (stroke) */
const I = n => `<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">${({
 home:'<path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/>',
 wallet:'<rect x="3" y="6" width="18" height="14" rx="2"/><path d="M16 13h2M3 10h18M6 6V4.5A1.5 1.5 0 0 1 7.5 3H17"/>',
 chart:'<path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/>', users:'<circle cx="9" cy="8" r="3.5"/><path d="M2.5 20a6.5 6.5 0 0 1 13 0M17 4.5a3.5 3.5 0 0 1 0 7M21.5 20a6 6 0 0 0-3.5-5.5"/>',
 building:'<rect x="4" y="3" width="16" height="18" rx="1"/><path d="M9 8h1M14 8h1M9 12h1M14 12h1M10 21v-4h4v4"/>',
 alert:'<path d="M12 3 2 20h20z"/><path d="M12 10v4M12 17.5v.01"/>', list:'<path d="M8 6h13M8 12h13M8 18h13M3 6h.01M3 12h.01M3 18h.01"/>',
 ticket:'<path d="M3 8a2 2 0 0 0 0 4v4a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-4a2 2 0 0 0 0-4V6a2 2 0 0 0-2-2H5a2 2 0 0 0-2 2z"/><path d="M14 4v14" stroke-dasharray="2 2"/>',
 form:'<rect x="4" y="3" width="16" height="18" rx="2"/><path d="M8 8h8M8 12h8M8 16h5"/>', book:'<path d="M4 4.5A2.5 2.5 0 0 1 6.5 2H20v17H6.5A2.5 2.5 0 0 0 4 21.5z"/><path d="M4 21.5A2.5 2.5 0 0 1 6.5 19H20"/>',
 cog:'<circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/>',
 sliders:'<path d="M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6"/>', send:'<path d="m22 2-7 20-4-9-9-4z"/><path d="M22 2 11 13"/>',
 logout:'<path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/>', menu:'<path d="M3 6h18M3 12h18M3 18h18"/>', ext:'<path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/>',
 shield:'<path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><path d="m9 12 2 2 4-4"/>',
 wand:'<path d="m15 4 5 5L9 20H4v-5zM13 6l5 5M18 2v3M21 5h-3"/>',
 bulb:'<path d="M9 18h6M10 22h4M12 2a7 7 0 0 0-4 12.7V17h8v-2.3A7 7 0 0 0 12 2z"/>',
 up:'<path d="M12 19V5M5 12l7-7 7 7"/>',
 coins:'<circle cx="8" cy="8" r="6"/><path d="M18.1 10.4A6 6 0 1 1 10.4 18.1M7 6h1v4M16.7 13.9l.7.7-2.8 2.8"/>',
})[n]||""}</svg>`;

/* ───────────────────────── setup wizard ───────────────────────── */
let SETUP={};
function wizShell(step, inner){
  return `<div class="center"><div class="wizard"><div style="text-align:center;margin-bottom:22px"><img src="/brand/logo" style="width:84px;height:84px;border-radius:50%;box-shadow:0 0 0 3px rgba(var(--brand-rgb),.35),0 20px 60px -10px rgba(var(--brand-rgb),.6)" alt="">
   <h1 style="margin:14px 0 4px;font-size:26px">Set up your bot</h1><p class="mute" style="margin:0">Three quick steps. Everything else is done from the panel.</p></div>
   <div class="steps">${[1,2,3].map(i=>`<div class="${i<=step?"on":""}"></div>`).join("")}</div><div class="card" style="padding:26px">${inner}</div></div></div>`;
}
function renderSetup(st){
  SETUP = st || {};
  $("#app").innerHTML = wizShell(1, `<h2 style="margin:0 0 6px">1 · Paste your bot token</h2>
   <p class="mute" style="margin:0 0 14px">Open the <a href="https://discord.com/developers/applications" target="_blank" rel="noopener">Discord Developer Portal</a> → <b>New Application</b> → <b>Bot</b> tab → <b>Reset Token</b> → copy it.</p>
   ${st.can_edit?"":`<label class="l">Setup code <span class="dim">— shown when you installed the bot (also in <code>data/setup-code.txt</code>)</span></label><input class="in" id="sc" autocomplete="off" style="text-transform:uppercase;letter-spacing:.15em;max-width:220px">`}
   <label class="l">Bot token</label><input class="in" id="stk" type="password" autocomplete="off" placeholder="MTIz…">
   <div style="margin-top:20px;display:flex;justify-content:flex-end"><button class="btn" id="sbtn" onclick="setupToken()">Continue →</button></div>`);
  ($("#sc")||$("#stk")).focus(); $("#stk").onkeydown=e=>{ if(e.key==="Enter") setupToken(); };
}
async function setupToken(){
  $("#sbtn").disabled=true;
  const r = await act(()=>api("/api/setup/token",{code:$("#sc")?.value, token:$("#stk").value}));
  if($("#sbtn")) $("#sbtn").disabled=false;
  if(r) { SETUP={...SETUP,...r}; setupGuild(); }
}
let guildPoll=null;
function setupGuild(){
  const r=SETUP;
  const fixes = (r.fixed||[]).map(f=>`<div class="pos" style="font-size:13px">✓ ${esc(f)}</div>`).join("");
  $("#app").innerHTML = wizShell(2, `<div class="u" style="gap:14px;margin-bottom:12px">${r.bot_avatar?`<img src="${esc(r.bot_avatar)}" style="width:48px;height:48px" alt="">`:""}
    <div><div class="b" style="font-size:17px">${esc(r.bot_name)}</div><div class="pos" style="font-size:13px">✓ Token accepted</div></div></div>${fixes}
   ${r.members_ok?"":`<div class="card" style="border-color:rgba(251,191,36,.4);margin:12px 0;padding:12px">⚠️ Turn on <b>Server Members Intent</b>: <a href="${esc(r.portal)}/bot" target="_blank" rel="noopener">Bot settings</a> → Privileged Gateway Intents.</div>`}
   <h2 style="margin:18px 0 6px">2 · Add it to your server</h2>
   <p class="mute" style="margin:0 0 14px">Click the button, pick your server and authorise. It shows up below automatically.</p>
   <a class="btn discord-btn" href="${esc(r.invite)}" target="_blank" rel="noopener">${I("ext")} Add ${esc(r.bot_name)} to a server</a>
   <div id="glist" style="margin-top:20px"></div>`);
  drawGuilds(r.guilds||[]);
  clearInterval(guildPoll); guildPoll=setInterval(async()=>{ try{ const g=await api("/api/setup/guilds"); drawGuilds(g.guilds); }catch(e){} }, 3000);
}
function drawGuilds(gs){
  const el=$("#glist"); if(!el) return clearInterval(guildPoll);
  el.innerHTML = gs.length ? `<label class="l">Your bot is in — pick the server this bot is for:</label>`+gs.map(g=>`<button class="feat" style="width:100%;margin-top:8px;text-align:left" onclick="pickGuild('${g.id}')">
     ${g.icon?`<img src="${esc(g.icon)}" style="width:38px;height:38px;border-radius:10px" alt="">`:`<div style="width:38px;height:38px;border-radius:10px;background:var(--glass2);display:grid;place-items:center">${esc(g.name[0])}</div>`}
     <div class="t"><b>${esc(g.name)}</b><small>${g.id}</small></div><span class="btn sm">Use this server</span></button>`).join("")
   : `<div class="mute" style="display:flex;align-items:center;gap:10px"><span class="dot wait"></span> Waiting for the bot to join a server…</div>`;
}
async function pickGuild(id){
  clearInterval(guildPoll);
  if(!await act(()=>api("/api/setup/finish",{guild_id:id}))) return;
  const r=SETUP;
  if(r.redirect_ok) return setupDone();
  $("#app").innerHTML = wizShell(3, `<h2 style="margin:0 0 6px">3 · Allow Discord login</h2>
   <p class="mute" style="margin:0 0 14px">Discord needs this panel's address once. Open <a href="${esc(r.portal)}/oauth2" target="_blank" rel="noopener">OAuth2 settings</a> → <b>Redirects</b> → <b>Add Redirect</b>, paste this, then <b>Save Changes</b>:</p>
   <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap"><code class="copy">${esc(r.redirect_uri)}</code>${copyBtn(r.redirect_uri)}</div>
   <div class="mute" style="margin-top:18px;display:flex;align-items:center;gap:10px"><span class="dot wait"></span> Waiting for you to save it…</div>
   <div style="margin-top:20px;display:flex;justify-content:flex-end;gap:8px"><button class="btn ghost" onclick="setupDone()">I've done it</button></div>`);
  guildPoll=setInterval(async()=>{ try{ const c=await api("/api/setup/redirect"); if(c.redirect_ok){ clearInterval(guildPoll); setupDone(); } }catch(e){} }, 3000);
}
function setupDone(){
  clearInterval(guildPoll);
  $("#app").innerHTML = wizShell(3, `<div style="text-align:center;padding:10px 0"><div style="font-size:46px">🎉</div><h2 style="margin:8px 0">You're connected</h2>
   <p class="mute">The bot is starting and adding its slash commands to your server. Log in to choose channels, features and branding.</p>
   <a class="btn discord-btn" href="/login" style="margin-top:12px">Login with Discord</a></div>`);
}

/* ───────────────────────── auth screens ───────────────────────── */
function renderLogin(){
  $("#app").innerHTML = `<div class="center"><div class="auth"><img class="logo" src="/brand/logo" alt="">
   <h1>${esc(BRAND.full||BRAND.name)}</h1><p>Sign in with Discord to manage your account, read documents and apply.</p>
   <a class="btn discord-btn" href="/login${location.hash?`?next=/${encodeURIComponent(location.hash)}`:""}"><svg width="22" height="22" viewBox="0 0 24 24" fill="#fff"><path d="M20.3 4.4A19.8 19.8 0 0 0 15.4 3l-.6 1.3a18.4 18.4 0 0 0-5.6 0L8.6 3a19.7 19.7 0 0 0-4.9 1.5C.6 9.1-.3 13.6.1 18.1a19.9 19.9 0 0 0 6 3l1.3-2.1a12.9 12.9 0 0 1-2-1l.5-.4a14.2 14.2 0 0 0 12.2 0l.5.4c-.6.4-1.3.7-2 1l1.3 2.1a19.8 19.8 0 0 0 6-3c.5-5.2-.8-9.7-3.6-13.7zM8 15.4c-1.2 0-2.2-1.1-2.2-2.4S6.8 10.6 8 10.6s2.2 1.1 2.2 2.4-1 2.4-2.2 2.4zm8 0c-1.2 0-2.2-1.1-2.2-2.4s1-2.4 2.2-2.4 2.2 1.1 2.2 2.4-1 2.4-2.2 2.4z"/></svg>Login with Discord</a>
   <p style="margin-top:26px"><a class="mute" href="/docs">📚 Browse public documents →</a></p></div></div>`;
}
function renderOffline(st){
  $("#app").innerHTML = `<div class="center"><div class="wizard"><div class="auth" style="max-width:none"><img class="logo" src="/brand/logo" alt=""><h1>Bot is ${esc(st.status||"offline")}</h1></div>
   ${st.can_edit?botCard(st):`<div class="card" style="text-align:center"><p class="mute">The panel will be back as soon as the bot is online.</p><a class="btn ghost" href="/login">Bot owner login</a></div>`}</div></div>`;
}

/* ───────────────────────── shell / nav ───────────────────────── */
const can = p => (ME.perms||[]).includes(p);
function navItems(){
  const f=ME.features, a=ME.admin, c=ME.counts||{}, out=[];
  out.push(["h","You"]);
  if(f.economy) out.push(["me","My account","wallet"]);
  if(f.documents) out.push(["docs","Documents","book"]);
  if(f.applications) out.push(["apply","Apply","form"]);
  if(a){
    out.push(["h","Staff"]); out.push(["overview","Overview","chart"]);
    if(f.economy&&can("economy")) out.push(["users","Citizens","users"]);
    if((f.business||f.departments)&&can("orgs")) out.push(["orgs","Businesses & Depts","building"]);
    if(f.citations&&can("citations")) out.push(["citations","Citations","alert",c.citations]);
    if(f.economy&&can("economy")) out.push(["ledger","Transactions","list"]);
    if(f.tickets&&can("tickets")) out.push(["tickets","Tickets","ticket",c.tickets]);
    if(f.applications&&can("applications")) out.push(["applications","Applications","form",c.applications]);
    if(f.documents&&can("documents")) out.push(["docbuilder","Document builder","book"]);
    if(can("setup")||can("staff")) out.push(["h","Configure"]);
    if(can("setup")) { out.push(["wizard","Setup wizard","wand"]); out.push(["setup","Server setup","sliders"]); out.push(["settings","Settings","cog"]); }
    if(can("staff")) out.push(["staff","Staff access","shield"]);
    out.push(["h","Developer"]); out.push(["requests","Feature requests","bulb"]);
  }
  return out;
}
const PAGES = {me:()=>pMe(), docs:()=>pDocs(), apply:()=>pApply(), overview:()=>pOverview(), users:()=>pUsers(), orgs:()=>pOrgs(), citations:()=>pCitations(), ledger:()=>pLedger(),
  tickets:()=>pTickets(), applications:()=>pApplications(), docbuilder:()=>pDocBuilder(), setup:()=>pSetup(), settings:()=>pSettings(), staff:()=>pStaff(), requests:()=>pRequests(), wizard:()=>startWizard()};
function shell(){
  const items = navItems();
  if(!PAGE || !items.some(i=>i[0]===PAGE)) PAGE = (items.find(i=>i[0]!=="h")||["docs"])[0];
  $("#app").innerHTML = `<div class="mobile-top"><button class="btn ghost icon" onclick="$('.side').classList.toggle('open')">${I("menu")}</button><img src="/brand/logo" alt=""><b>${esc(BRAND.name)}</b></div>
  <div class="app"><aside class="side"><a class="brand" href="/"><img src="/brand/logo" alt=""><span><b>${esc(BRAND.name)}</b><small>${esc(BRAND.full||ME.guild.name)}</small></span></a>
   ${items.map(i=>i[0]==="h"?`<div class="nav-h">${i[1]}</div>`:`<button class="nav ${i[0]===PAGE?"on":""}" data-p="${i[0]}">${I(i[2])}<span>${i[1]}</span>${i[3]?`<span class="badge">${i[3]}</span>`:""}</button>`).join("")}
   <div class="grow"></div>
   <div class="me">${ME.user.avatar?`<img src="${esc(ME.user.avatar)}" alt="">`:""}<div class="n"><b>${esc(ME.user.name)}</b><small>${esc((ME.ranks||[]).join(", ")||"Member")}</small></div><a class="btn ghost icon" href="/logout" title="Log out">${I("logout")}</a></div>
  </aside><div class="side-dim" onclick="$('.side').classList.remove('open')"></div><main class="main" id="main"></main></div>
  <nav class="bottom-nav">${bottomItems(items).map(i=>`<button class="${i[0]===PAGE?"on":""}" data-b="${i[0]}">${I(i[2])}<span>${i[1]}</span>${i[3]?`<span class="badge">${i[3]}</span>`:""}</button>`).join("")}<button data-b="__more">${I("menu")}<span>More</span></button></nav>`;
  $$(".nav").forEach(b=>b.onclick=()=>go(b.dataset.p));
  $$("[data-b]").forEach(b=>b.onclick=()=>b.dataset.b==="__more"?$(".side").classList.add("open"):go(b.dataset.b));
  render();
}
function bottomItems(items){
  const pages=items.filter(i=>i[0]!=="h"), short={"Businesses & Depts":"Orgs","Document builder":"Docs","Pending applications":"Apps","My account":"Account","Server setup":"Setup","Transactions":"Ledger"};
  const pref = ME.admin ? ["overview","tickets","applications","me"] : ["me","docs","apply"];
  return pref.map(k=>pages.find(i=>i[0]===k)).filter(Boolean).slice(0,4).map(i=>[i[0],short[i[1]]||i[1],i[2],i[3]]);
}
function go(p){ PAGE=p; history.replaceState(null,"","#"+p); $$(".nav").forEach(b=>b.classList.toggle("on",b.dataset.p===p)); $$("[data-b]").forEach(b=>b.classList.toggle("on",b.dataset.b===p)); window.scrollTo(0,0); $(".side")?.classList.remove("open"); render(); }
async function render(){ $("#main").innerHTML=`<div class="empty"><span class="e-ico">⏳</span>Loading…</div>`; try{ await (PAGES[PAGE]||PAGES.docs)(); }catch(e){ if(e.message!=="login") $("#main").innerHTML=`<div class="card">${empty("⚠️",esc(e.message))}</div>`; } }
const head = (t, sub, right="") => `<div class="page-h"><div><h1>${t}</h1>${sub?`<p>${sub}</p>`:""}</div><div style="display:flex;gap:8px;flex-wrap:wrap;align-items:center">${right}</div></div>`;
const stat = (lbl, val, sub, ico) => `<div class="card stat"><div class="lbl">${lbl}</div><div class="val">${val}</div>${sub?`<div class="sub">${sub}</div>`:""}${ico?`<div class="ico">${I(ico)}</div>`:""}</div>`;
const seg = (vals, cur, fn) => `<div class="seg">${vals.map(v=>`<button class="${v===cur?"on":""}" onclick="${fn}('${v}')">${v}</button>`).join("")}</div>`;

/* ───────────────────────── shared tables ───────────────────────── */
function flow(r, me){
  const side = x => x.type==="mint"?"<i class='dim'>minted</i>":x.type==="burn"?"<i class='dim'>removed</i>":
    `${esc(x.label)}${x.type==="wallet"?" <span class='dim'>(wallet)</span>":""}${x.type==="business"||x.type==="dept"?` <span class="pill ${x.type}">${x.type==="dept"?"dept":"biz"}</span>`:""}`;
  let cls=""; if(me){ const i=["wallet","bank"].includes(r.dst.type)&&r.dst.id===me, o=["wallet","bank"].includes(r.src.type)&&r.src.id===me; cls=i&&o?"":i?"pos":"neg"; }
  return `<td class="dim mono">#${r.id}</td><td>${side(r.src)} <span class="dim">→</span> ${side(r.dst)}</td><td class="${cls} b">${fmt(r.amount)}</td>

   ${o.who?`<td>${user(c.issuer)}</td>`:""}<td style="white-space:nowrap">${c.status==="unpaid"?(o.pay?`<button class="btn green sm" onclick="payCit(${c.id})">Pay</button>`:"")+(o.admin?` <button class="btn ghost sm" onclick="citAct(${c.id},'waive_fee')">Waive fee</button> <button class="btn red sm" onclick="citAct(${c.id},'void')">Void</button>`:""):""}</td></tr>`).join("")}</table></div>`;

function qField(q){
  const id=`qa_${q.id}`, req=q.required?' <span class="neg">*</span>':"";
  const lab=`<label class="l" style="font-size:13.5px;color:var(--text)">${esc(q.label)}${req}</label>${q.help?`<div class="dim" style="font-size:12px;margin:-2px 0 6px">${esc(q.help)}</div>`:""}`;
  if(q.type==="paragraph") return lab+`<textarea class="in" id="${id}" rows="5"></textarea>`;
  if(q.type==="choice") return lab+`<select class="in" id="${id}"><option value="">Choose…</option>${q.options.map(o=>`<option>${esc(o)}</option>`).join("")}</select>`;
  if(q.type==="multi") return lab+q.options.map(o=>`<label class="chk"><input type="checkbox" name="${id}" value="${esc(o)}"><span>${esc(o)}</span></label>`).join("");
  if(q.type==="yesno") return lab+`<div class="seg" id="${id}" data-v=""><button type="button" onclick="segPick(this,'yes')">Yes</button><button type="button" onclick="segPick(this,'no')">No</button></div>`;
  return lab+`<input class="in" id="${id}" ${q.type==="number"?'inputmode="decimal"':""}>`;
}
function segPick(b,v){ const s=b.parentElement; s.dataset.v=v; [...s.children].forEach(x=>x.classList.toggle("on",x===b)); }
function applyForm(id){
  const f=APPLY.forms.find(x=>x.id===id);
  openModal(`<h2>${esc(f.icon||"📝")} ${esc(f.name)}</h2>${f.description?`<p class="mute" style="white-space:pre-wrap">${esc(f.description)}</p>`:""}

   <div style="display:flex;justify-content:flex-end;gap:8px;margin-top:22px"><button class="btn ghost" onclick="closeModal()">Cancel</button><button class="btn" id="asub" onclick="submitApp(${id})">Submit application</button></div>`);
}
async function submitApp(id){
  const f=APPLY.forms.find(x=>x.id===id), answers={};
  f.questions.forEach(q=>{ const k=`qa_${q.id}`; answers[q.id] = q.type==="multi"?$$(`[name="${k}"]:checked`).map(x=>x.value):q.type==="yesno"?$("#"+k).dataset.v:$("#"+k).value; });
  $("#asub").disabled=true;
  if(await act(()=>api("/api/apply",{form_id:id,answers}),"Application submitted — you'll get a DM when it's reviewed")){ closeModal(); history.replaceState(null,"","#apply"); pApply(); }
  else $("#asub").disabled=false;
}

  $("#ed").addEventListener("paste", e=>{ const h=e.clipboardData.getData("text/html"); if(!h) return; e.preventDefault(); document.execCommand("insertHTML",false,h.replace(/<(script|style)[\s\S]*?<\/\1>/gi,"").replace(/ (style|class)="[^"]*"/gi,"")); });

function ed(cmd){
  const E=$("#ed"); E.focus();
  if(["h1","h2","h3","p"].includes(cmd)) return document.execCommand("formatBlock",false,cmd.toUpperCase());
  if(cmd==="quote") return document.execCommand("formatBlock",false,"BLOCKQUOTE");
  if(cmd==="mark"){ const s=getSelection().toString(); return s&&document.execCommand("insertHTML",false,`<mark>${esc(s)}</mark>`); }
  if(cmd==="link"){ const u=prompt("Link address (https://…)"); return u&&document.execCommand("createLink",false,u); }
  if(cmd==="hr") return document.execCommand("insertHTML",false,"<hr><p><br></p>");
  if(cmd==="table"){ const r=+prompt("How many rows?",4)||0, c=+prompt("How many columns?",3)||0; if(!r||!c) return;
    return document.execCommand("insertHTML",false,`<table><thead><tr>${"<th>Heading</th>".repeat(c)}</tr></thead><tbody>${`<tr>${"<td>&nbsp;</td>".repeat(c)}</tr>`.repeat(Math.max(1,r-1))}</tbody></table><p><br></p>`); }
  if(cmd==="image"){ const i=document.createElement("input"); i.type="file"; i.accept="image/*"; i.onchange=()=>{ const f=i.files[0]; if(!f) return; if(f.size>2.5e6) return toast("Image must be under 2.5 MB",false);
    const rd=new FileReader(); rd.onload=()=>{ E.focus(); document.execCommand("insertHTML",false,`<img src="${rd.result}" alt=""><p><br></p>`); }; rd.readAsDataURL(f); }; return i.click(); }
  if(cmd.startsWith("callout-")){ const s=getSelection().toString()||"Write something important here."; return document.execCommand("insertHTML",false,`<div class="callout ${cmd}">${esc(s)}</div><p><br></p>`); }
  document.execCommand(cmd,false,null);
}

  const dot={online:"on",starting:"wait",error:"err"}[st.status]||"";
  return `<div class="card"><div class="card-h"><h3>Bot connection</h3></div>
   <div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap">${st.bot_avatar?`<img src="${esc(st.bot_avatar)}" style="width:44px;height:44px;border-radius:50%" alt="">`:""}<div><b>${esc(st.bot_name||"Bot")}</b><div class="mute" style="font-size:13px"><span class="dot ${dot}"></span> ${esc(st.status)}${st.guild_name?` · in ${esc(st.guild_name)}`:""}</div></div>
   <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap">${st.invite?`<a class="btn ghost sm" href="${esc(st.invite)}" target="_blank" rel="noopener">Invite link</a>`:""}<button class="btn ghost sm" onclick="restartBot()">Restart bot</button></div></div>
   ${st.error?`<p class="neg">⚠️ ${esc(st.error)}</p>`:""}${st.warning?`<p style="color:var(--gold)">⚠️ ${esc(st.warning)}</p>`:""}
   <details style="margin-top:14px"><summary style="cursor:pointer;color:var(--mute)">Advanced — change token, server or owners</summary>
    <label class="l">New bot token (leave empty to keep)</label><input class="in" id="xtk" type="password" autocomplete="off">
    <label class="l">Server ID</label><input class="in" id="xg" value="${esc(st.guild_id||"")}">
    <label class="l">Bot Creator user IDs (can always log in, even if the bot is down)</label><input class="in" id="xo" value="${esc(st.owner_ids||"")}">
    <label class="l">Public URL (if you put a domain / HTTPS in front)</label><input class="in" id="xu" value="${esc(st.public_url||"")}" placeholder="https://panel.example.com">
    <p class="dim" style="font-size:12px">Discord login redirect: <code class="copy">${esc(st.redirect_uri)}</code></p>
    <button class="btn" onclick="advSave()">Save & restart</button></details></div>`;
}
async function advSave(){ if(await act(()=>api("/api/setup",{token:$("#xtk").value,guild_id:$("#xg").value,owner_ids:$("#xo").value,public_url:$("#xu").value}),"Saved — restarting")) setTimeout(()=>location.reload(),6000); }
async function restartBot(){ if(await act(()=>api("/api/setup/restart",{}),"Restarting…")) setTimeout(()=>location.reload(),6000); }
const SET_HELP={currency:"Currency symbol",start_balance:"Starting balance for new accounts",payroll_hours:"Auto-payroll every N hours (0 = manual)",sales_tax:"Sales tax % on shop purchases",interest:"Daily bank interest %",late_fee:"Late fee % on overdue citations",citation_days:"Days to pay a citation",business_cost:"Cost to open a business",max_businesses:"Max businesses per player"};
async function pSettings(){
  const d=await api("/api/settings"), s=d.settings;
  const dp=opt(d.depts.map(x=>({id:x.id,label:x.name})),s.treasury_dept,"— none (money destroyed) —");
  $("#main").innerHTML = head("Settings","Bot connection, updates, economy rules and integrations.") + botCard({...d.bot}) + `<div id="updcard"></div>` + `
  <div class="card"><div class="card-h"><h3>Economy</h3></div><div class="grid" style="grid-template-columns:repeat(auto-fill,minmax(230px,1fr))">${Object.entries(SET_HELP).map(([k,v])=>`<div><label class="l">${v}</label><input class="in" data-s="${k}" value="${esc(s[k])}"></div>`).join("")}
   <div><label class="l">Treasury department (taxes, fees, fines)</label><select class="in" data-s="treasury_dept">${dp}</select></div></div>
   <label class="chk"><input type="checkbox" data-s="dm_receipts" ${s.dm_receipts?"checked":""}><span>DM players receipts and notices</span></label>
   <div style="text-align:right"><button class="btn" onclick="saveSettings()">Save economy settings</button></div></div><div id="cadcard"></div>`;
  if(ME.features.cad) cadCard(d);

let UPD=null, updPoll=null;
async function updCard(){
  const el=$("#updcard"); if(!el) return clearInterval(updPoll);
  const u=UPD=await api("/api/updates"), st=u.status||{}, L=u.latest;
  const running = u.queued || st.state==="running";
  el.innerHTML=`<div class="card" style="${u.update_available?"border-color:rgba(var(--brand-rgb),.55)":""}"><div class="card-h"><h3>${I("up")} Updates</h3><span class="pill ${u.hub.connected?"green":"red"}">${u.hub.connected?"connected to update server":"update server unreachable"}</span></div>
   <div style="display:flex;gap:18px;align-items:center;flex-wrap:wrap"><div><div class="dim" style="font-size:12px">Installed</div><div style="font-size:22px;font-weight:700">v${esc(u.version)}</div></div>
    ${L?`<div><div class="dim" style="font-size:12px">Latest</div><div style="font-size:22px;font-weight:700">v${esc(L.version)} ${L.critical?'<span class="pill red">critical</span>':""}</div></div>`:""}
    <div style="margin-left:auto;display:flex;gap:8px;flex-wrap:wrap"><button class="btn ghost sm" onclick="updAct('check')">Check now</button>
    ${running?`<span class="pill gold" style="padding:8px 12px"><span class="dot wait"></span>&nbsp;Updating… the panel restarts in about a minute</span>`:u.update_available?`<button class="btn" onclick="updAct('update')">Update to v${esc(L.version)}</button>`:`<span class="pill green" style="padding:8px 12px">Up to date</span>`}</div></div>
   ${u.update_available&&L?`<div class="card" style="margin-top:14px;background:var(--glass3)"><b>${esc(L.title||"What's new")}</b><div style="white-space:pre-wrap;margin-top:6px;color:#d4dbe8">${esc(L.notes||"")}</div></div>`:""}
   ${st.state==="failed"?`<div class="card neg" style="margin-top:12px">⚠️ The last update (${esc(st.from)} → ${esc(st.target||"?")}) failed. <details><summary>Show log</summary><pre class="mono" style="white-space:pre-wrap;font-size:12px">${esc(st.log||"")}</pre></details></div>`:st.state==="done"&&st.from!==st.to?`<p class="pos" style="margin:12px 0 0">✓ Updated ${esc(st.from)} → ${esc(st.to)} ${ago(st.at)}</p>`:""}
   ${u.updater?"":`<p class="dim" style="font-size:12.5px;margin:12px 0 0">One-click updates need the host updater, which the one-line installer sets up.</p>`}
   <label class="chk" style="margin-top:16px"><input type="checkbox" id="ua" ${u.prefs.auto?"checked":""} onchange="updPrefs()"><span>Install updates automatically<small>Checks every 15 minutes</small></span></label>
   <label class="chk"><input type="checkbox" id="ur" ${u.prefs.allow_remote?"checked":""} onchange="updPrefs()"><span>Allow the developer to push updates to this bot<small>Lets OpsLab install a fix for you remotely</small></span></label></div>`;
  clearInterval(updPoll); if(running) updPoll=setInterval(()=>{ updCard().catch(()=>{}); }, 6000);
}
async function updAct(action){ if(action==="update"&&!confirm(`Update to v${UPD.latest.version}? The bot and panel restart for about a minute.`)) return;
  if(await act(()=>api("/api/updates",{action}),action==="check"?"Checked":"Update started")) updCard(); }
async function updPrefs(){ await act(()=>api("/api/updates",{action:"prefs",auto:$("#ua").checked,allow_remote:$("#ur").checked}),"Saved"); }
async function saveSettings(){ const b={}; $$("[data-s]").forEach(e=>b[e.dataset.s]=e.type==="checkbox"?e.checked:e.value); await act(()=>api("/api/settings",b),"Settings saved"); }
async function cadCard(d){

   <p class="mute" style="margin-top:0">CAD tickets for citizens whose CAD account is linked to Discord become citations here. Paying them marks the CAD ticket <b>PAID</b>; tickets paid in the CAD are cleared here. Adds <code>/cad profile</code>.</p>
   ${c.last_error?`<p class="neg">⚠️ ${esc(c.last_error)}</p>`:""}${c.last_sync?`<p class="dim">Last sync ${ago(c.last_sync)}</p>`:""}
   <label class="chk"><input type="checkbox" id="ce" ${c.enabled?"checked":""}><span><b>Enabled</b></span></label>
   <div class="seg" style="margin:6px 0 4px"><button class="${api?"on":""}" onclick="cadMode('api')">API token (hosted or self-hosted)</button><button class="${api?"":"on"}" onclick="cadMode('db')">Direct database (self-hosted)</button></div>
   <input type="hidden" id="cmode" value="${api?"api":"db"}">
   <div id="cad_api" style="display:${api?"":"none"}">
    <label class="l">CAD or API URL <span class="dim">— e.g. https://csrpcad.snailyapp.com (the API address is worked out automatically)</span></label><input class="in" id="caurl" value="${esc(c.api_url||"")}" placeholder="https://yourcad.snailyapp.com">
    <label class="l">API token ${c.has_token?'<span class="dim">(saved — leave empty to keep)</span>':'<span class="dim">— CAD → Admin → CAD Settings → API Token → enable & copy</span>'}</label><input class="in" id="catok" type="password" autocomplete="off">
    <p class="dim" style="font-size:12px">In the CAD also turn on the <b>Citizen record payments</b> feature so paid fines can be marked in the CAD.</p></div>
   <div id="cad_db" style="display:${api?"none":""}">
    <div class="row"><div style="flex:3"><label class="l">Database host</label><input class="in" id="ch" value="${esc(c.host||"")}"></div><div><label class="l">Port</label><input class="in" id="cp" value="${esc(c.port||"3306")}"></div></div>
    <div class="row"><div><label class="l">Database</label><input class="in" id="cdb" value="${esc(c.database||"")}"></div><div><label class="l">User</label><input class="in" id="cu" value="${esc(c.user||"")}"></div><div><label class="l">Password${c.has_password?' <span class="dim">(saved)</span>':""}</label><input class="in" id="cpw" type="password" autocomplete="off"></div></div></div>
   <label class="l">Department that receives CAD fines</label><select class="in" id="cd">${opt(d.depts.map(x=>({id:x.id,label:x.name})),c.dept_id,"— treasury —")}</select>
   <label class="chk"><input type="checkbox" id="cst" ${c.sync_tickets!==false?"checked":""}><span>Import CAD tickets as citations</span></label>
   <label class="chk"><input type="checkbox" id="cmp" ${c.mark_paid!==false?"checked":""}><span>Mark CAD tickets PAID when paid here</span></label>
   ${c.enabled?"":`<label class="chk"><input type="checkbox" id="cio"><span>Also import older unpaid tickets</span></label>`}
   <div style="display:flex;gap:8px;justify-content:flex-end"><button class="btn ghost" onclick="cadTest()">Test connection</button><button class="btn" onclick="cadSave()">Save</button></div><div id="cadres"></div></div>`;
}
function cadMode(m){ $("#cmode").value=m; $("#cad_api").style.display=m==="api"?"":"none"; $("#cad_db").style.display=m==="api"?"none":""; $$("#cadcard .seg button").forEach((b,i)=>b.classList.toggle("on",(i===0)===(m==="api"))); }
const cadBody=()=>({mode:$("#cmode").value,enabled:$("#ce").checked,api_url:$("#caurl").value,api_token:$("#catok").value,host:$("#ch").value,port:$("#cp").value,database:$("#cdb").value,user:$("#cu").value,password:$("#cpw").value,dept_id:$("#cd").value,sync_tickets:$("#cst").checked,mark_paid:$("#cmp").checked,import_old:$("#cio")?.checked});
async function cadTest(){ try{ const r=await api("/api/cad/test",cadBody()); $("#cadres").innerHTML=`<div class="card" style="margin-top:12px;border-color:rgba(52,211,153,.5)">✅ Connected${r.api_base?` to <code>${esc(r.api_base)}</code>`:""} · ${r.citizens} citizens with records · ${r.linked_users} CAD users linked to Discord${r.unpaid_tickets!=null?` · ${r.unpaid_tickets} unpaid tickets`:""}${r.can_mark_paid?"":"<br>⚠️ This DB user can't UPDATE — tickets won't be marked paid in the CAD."}</div>`; }catch(e){ $("#cadres").innerHTML=`<div class="card neg" style="margin-top:12px">${esc(e.message)}</div>`; } }
async function cadSave(){ if(await act(()=>api("/api/cad",cadBody()),"Saved")) pSettings(); }

/* ───────────────────────── onboarding wizard ───────────────────────── */
let WZ=null;
const WZ_STEPS=[["welcome","Welcome"],["features","Features"],["channels","Channels"],["staff","Staff access"],["economy","Economy"],["finish","Finish"]];
async function startWizard(){
  $("#app").innerHTML=`<div class="center">${empty("⏳","Loading your server…")}</div>`;
  const [g, st, se] = await Promise.all([api("/api/guild-setup"), api("/api/staff"), api("/api/settings")]);
  GS=g; STAFF=st;
  RANKS=st.ranks.map(r=>({...r, users:r.users.map(u=>u.id), _users:Object.fromEntries(r.users.map(u=>[u.id,u]))}));
  WZ={step:0, cfg:{...g.config}, features:{...g.features}, eco:{...se.settings}, owners:st.owners.map(o=>o.id), ownerInfo:Object.fromEntries(st.owners.map(o=>[o.id,o])), TT:JSON.parse(JSON.stringify(g.config.ticket_types||[]))};
  wzDraw();
}
function wzShell(inner){
  const i=WZ.step;
  return `<div class="center" style="align-items:start;padding-top:5vh"><div class="wizard" style="max-width:860px">
   <div style="display:flex;align-items:center;gap:14px;margin-bottom:18px"><img src="/brand/logo" style="width:52px;height:52px;border-radius:50%;box-shadow:0 0 0 2px rgba(var(--brand-rgb),.4)" alt="">
    <div style="flex:1"><div class="dim" style="font-size:12px;text-transform:uppercase;letter-spacing:.1em">Step ${i+1} of ${WZ_STEPS.length}</div><div style="font-size:20px;font-weight:700">${WZ_STEPS[i][1]}</div></div>
    <a class="btn ghost sm" href="#" onclick="event.preventDefault();if(ME.onboarded||confirm('Skip the wizard? You can run it again any time from the sidebar.')){if(PAGE==='wizard')PAGE='setup';ME.onboarded=true;shell();}">${ME.onboarded?"Close":"Skip"}</a></div>
   <div class="steps">${WZ_STEPS.map((x,j)=>`<div class="${j<=i?"on":""}" title="${x[1]}"></div>`).join("")}</div>
   <div class="card" style="padding:24px">${inner}</div>
   <div style="display:flex;justify-content:space-between;margin-top:16px;gap:10px">${i?`<button class="btn ghost" onclick="wzGo(-1)">← Back</button>`:"<span></span>"}
    ${i<WZ_STEPS.length-1?`<button class="btn" onclick="wzGo(1)">Next →</button>`:`<button class="btn" id="wzfin" style="padding:12px 26px" onclick="wzFinish()">Finish setup ✓</button>`}</div></div></div>`;
}
function wzCollect(){
  $$("[data-wk]").forEach(e=>WZ.cfg[e.dataset.wk]=e.value);
  $$("[data-we]").forEach(e=>WZ.eco[e.dataset.we]=e.type==="checkbox"?e.checked:e.value);
  $$("[data-wf]").forEach(e=>WZ.features[e.dataset.wf]=e.classList.contains("on"));
  if($("#tstaff")) WZ.cfg.ticket_staff_roles=rpVal("tstaff");
  if($("#wz_tt")) WZ.cfg.ticket_types=WZ.TT;
  if($("#ranks")) syncRankRoles();
}
function wzGo(d){ wzCollect(); WZ.step=Math.max(0,Math.min(WZ_STEPS.length-1,WZ.step+d));
  if(WZ_STEPS[WZ.step][0]==="economy" && !WZ.features.economy) WZ.step+=d; window.scrollTo(0,0); wzDraw(); }

    <div><div class="nav-h" style="padding-left:0">Discord</div>${[["docs_channel","Documents panel"],["ticket_panel_channel","Ticket panel"],["apps_channel","Applications panel"],["log_channel","Logs"]].map(([x,l])=>`<div>${c[x]?"✅":"▫️"} ${l}${c[x]?` → #${esc((GS.channels.find(y=>y.id==c[x])||{}).name||"channel")}`:" — not set"}</div>`).join("")}
     <div class="nav-h" style="padding-left:0;margin-top:10px">Staff</div><div>👑 ${WZ.owners.length} owner(s)</div>${RANKS.map(r=>`<div>🛡️ ${esc(r.name)} — ${r.roles.length} role(s), ${r.users.length} user(s)</div>`).join("")}</div></div>
    ${GS.bot_top_role<=1||(GS.role_problems||[]).length?`<div class="card" style="margin-top:16px;border-color:rgba(251,191,36,.5)">⚠️ Last thing in Discord: <b>Server Settings → Roles</b>, drag the bot's role near the top so it can hand out roles.</div>`:""}
    <p class="mute" style="margin-bottom:0">The bot posts its panels right away. If you changed features it restarts for a few seconds.</p>`; }
  $("#app").innerHTML=wzShell(h);
  if(k==="staff") ranksDraw();
  if(k==="channels" && f.tickets) wzTT();
}
function wzReset(){
  if(!confirm("Reset features, channels, ticket types, staff ranks, branding and economy settings to defaults? (Owners and your data stay. Nothing is saved until you press Finish.)")) return;
  WZ.features={economy:true,business:true,departments:true,payroll:true,citations:true,shop:true,tickets:true,documents:true,applications:true,cad:false};
  ["log_channel","docs_channel","docs_ack_role","ticket_panel_channel","ticket_category","ticket_log_channel","apps_channel"].forEach(k=>WZ.cfg[k]="");
  WZ.cfg.ticket_staff_roles=[]; WZ.cfg.brand_name="Panel"; WZ.cfg.brand_full=ME.guild.name; WZ.cfg.brand_color="#38b6ff";
  WZ.TT=[{name:"General Support",emoji:"💬",description:"Questions or help with anything"},{name:"Player Report",emoji:"🚩",description:"Report a player or rule break"},{name:"Ban Appeal",emoji:"⚖️",description:"Appeal a ban or punishment"},{name:"Department Application",emoji:"🚓",description:"Join LEO / Fire / EMS / DOT"}];
  WZ.eco={...WZ.eco,currency:"$",start_balance:5000,payroll_hours:168,citation_days:7,late_fee:10,sales_tax:0,dm_receipts:true};
  RANKS=[{id:"admin",name:"Admin",color:"#f87171",perms:["economy","orgs","citations","tickets","applications","documents","setup"],roles:[],users:[],_users:{},assign_role:false},
   {id:"moderator",name:"Moderator",color:"#a78bfa",perms:["citations","tickets","applications"],roles:[],users:[],_users:{},assign_role:false},
   {id:"support",name:"Support",color:"#34d399",perms:["tickets"],roles:[],users:[],_users:{},assign_role:false}];
  toast("Reset — step through and press Finish to apply"); wzDraw();
}
function wzTT(){ $("#wz_tt").innerHTML=WZ.TT.map((t,i)=>`<div class="tt-row" style="display:flex;gap:6px;margin-top:8px"><input class="in tt-emoji" style="width:58px" value="${esc(t.emoji)}" oninput="WZ.TT[${i}].emoji=this.value"><input class="in tt-name" style="flex:1" value="${esc(t.name)}" placeholder="Name" oninput="WZ.TT[${i}].name=this.value"><input class="in tt-desc" style="flex:2" value="${esc(t.description)}" placeholder="Description" oninput="WZ.TT[${i}].description=this.value"><button class="btn red sm" onclick="WZ.TT.splice(${i},1);wzTT()">✕</button></div>`).join(""); }
function wzOwner(){ const v=$("#wzown").value.trim(); if(!/^\d{15,21}$/.test(v)) return toast("That's not a Discord user ID",false); wzCollect(); if(!WZ.owners.includes(v)) WZ.owners.push(v); wzDraw(); }
async function wzAuto(){ wzCollect();
  // save features first so the right panels get created/posted
  $("#wzac").disabled=true; $("#wzac").textContent="Creating…";
  const r=await act(()=>api("/api/guild-setup/autocreate",{}));
  if(r){ const g=await api("/api/guild-setup"); GS=g; ["log_channel","docs_channel","docs_ack_role","ticket_panel_channel","ticket_category","ticket_log_channel","apps_channel"].forEach(x=>{ if(g.config[x]) WZ.cfg[x]=g.config[x]; });
    toast(`Created ${r.made.length} channels/roles`); wzDraw(); }
  else if($("#wzac")){ $("#wzac").disabled=false; $("#wzac").textContent="Create channels for me"; }
}
async function wzFinish(){
  wzCollect(); $("#wzfin").disabled=true; $("#wzfin").textContent="Saving…";
  const steps=[];
  if(WZ.features.economy) steps.push(()=>api("/api/settings",Object.fromEntries(["currency","start_balance","payroll_hours","citation_days","late_fee","sales_tax","dm_receipts"].map(x=>[x,WZ.eco[x]]))));
  if(STAFF.is_owner) steps.push(()=>api("/api/staff",{owners:WZ.owners,confirm_self_remove:false}));
  steps.push(()=>api("/api/staff",{ranks:RANKS.map(({_users,role_members,...x})=>x)}));
  const keys=["log_channel","docs_channel","docs_ack_role","ticket_panel_channel","ticket_category","ticket_log_channel","apps_channel","brand_name","brand_full","brand_color","ticket_max_open","docs_title","docs_text","ticket_panel_title","ticket_panel_text","apps_title","apps_text"];
  let res=null;
  steps.push(async()=>{ res=await api("/api/guild-setup",{...Object.fromEntries(keys.map(x=>[x,WZ.cfg[x]])),ticket_staff_roles:WZ.cfg.ticket_staff_roles||[],ticket_types:WZ.TT,features:WZ.features,onboarded:true}); });
  for(const s of steps){ if(!await act(s)){ $("#wzfin").disabled=false; $("#wzfin").textContent="Finish setup ✓"; return; } }
  $("#app").innerHTML=`<div class="center"><div class="auth" style="max-width:520px"><div style="font-size:54px">🚀</div><h1>You're live!</h1>
   <p>${res&&res.restarting?"The bot is restarting with your features — give it a few seconds. ":""}Panels are being posted in Discord.</p>
   <button class="btn" style="padding:12px 26px" onclick="location.href='/#overview';location.reload()">Open the panel</button></div></div>`;
}

/* ───────────────────────── boot ───────────────────────── */
(async function boot(){
  try{ applyBrand(await (await fetch("/api/brand")).json()); }catch(e){}
  let st={}; try{ st=await (await fetch("/api/setup/status")).json(); }catch(e){}
  if(!st.configured) return renderSetup(st);
  try{ ME=await api("/api/me"); }catch(e){
    if(e.message==="login") return;
    if(e.message==="bot offline") return renderOffline(st);
    $("#app").innerHTML=`<div class="center"><div class="card auth"><h1>⛔</h1><p>${esc(e.message)}</p><a class="btn ghost" href="/logout">Log out</a></div></div>`; return; }
  CUR=ME.currency; applyBrand(ME.brand);
  const h=location.hash.slice(1), base=h.split("-")[0];
  if(h.startsWith("doc-edit")) PAGE="docbuilder"; else if(h.startsWith("ticket-")) PAGE="tickets"; else if(h.startsWith("apply-")) PAGE="apply"; else if(PAGES[base]) PAGE=base;
  if(can("setup") && !ME.onboarded) return startWizard().catch(e=>{ toast(e.message,false); shell(); });
  shell();
})();
</script>
